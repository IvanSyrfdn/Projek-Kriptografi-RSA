<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat - halodawg</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="dashboard.html">halo<span>dawg</span></a>
    <nav><a href="dashboard.html">&larr; Dashboard</a></nav>
  </header>

  <main class="card wide">
    <h1 id="title">Chat</h1>
    <label class="muted small"><input type="checkbox" id="toggle-cipher"> Tampilkan ciphertext RSA</label>
    <div id="messages"></div>
    <form id="form-send">
      <input id="text" placeholder="Tulis pesan…" autocomplete="off" required>
      <button type="submit">Kirim</button>
    </form>
    <p id="status" class="muted small"></p>
  </main>

  <script src="sha256.js"></script>
  <script src="rsa.js"></script>
  <script src="js/api.js"></script>
  <script src="js/keystore.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
